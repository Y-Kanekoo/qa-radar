name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Pin Python for this run
        run: echo "${{ matrix.python-version }}" > .python-version

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest -v --cov=qa_radar --cov-report=term-missing

      - name: Coverage threshold (>=80%)
        run: uv run coverage report --fail-under=80

  workflow-lint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: jq の存在確認
        # tests/unit/test_notify_alert.py の requires_jq マーカーは jq 未検出時に
        # テストをサイレントにスキップするだけで CI を失敗させないため、
        # ランナー前提の jq が実際に使えることをここで明示的に検証する
        run: command -v jq

      - name: Install actionlint (バージョン固定)
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: actionlint (ワークフロー全4本 + shellcheck 連携)
        # ubuntu-latest には shellcheck がプリインストール済みのため、
        # actionlint は自動検出して run: ブロックのシェルも検査する
        run: actionlint -color

      - name: shellcheck (scripts/*.sh)
        run: shellcheck scripts/*.sh
