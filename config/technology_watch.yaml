# Official project metadata checked on 2026-10-07. Keep claims short and link
# to primary documentation. Pricing can change; the digest links to current terms.
# Only sources listed here are eligible for the separate technology digest.
version: 1
profiles:
  playwright-mcp-releases:
    name: Playwright MCP
    dedicated_only: true
    capability: LLMからアクセシビリティ情報を使ってブラウザを操作
    qa_use: 探索テストとUI操作の試作
    try_now: npx @playwright/mcp@latest をMCPクライアントに登録
    limitations: Node.js 18以上とMCPクライアントが必要。操作結果の再現性は自分で検証
    maturity: 公式リリースあり。QA用途の実検証は未実施
    license: Apache-2.0
    license_url: https://github.com/microsoft/playwright-mcp/blob/main/LICENSE
    pricing: OSS本体は無償。接続先モデル等の費用は構成次第
    pricing_url: https://github.com/microsoft/playwright-mcp#requirements
    docs_url: https://github.com/microsoft/playwright-mcp#readme

